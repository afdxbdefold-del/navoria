# Navoria Nginx Reverse Proxy Config — auf HOST installiert (nicht in Docker)
# Wildcard-Subdomain-Support: navoria.de + *.navoria.de
# SSL via Let's Encrypt (certbot mit dns-ionos Plugin)

# ---- HTTP → HTTPS Redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name navoria.de *.navoria.de;

    # Let's-Encrypt HTTP-01 (falls später genutzt) — aktuell nutzen wir DNS-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: Root + Wildcard — alle Anfragen zum Docker-Container weiterleiten ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name navoria.de *.navoria.de;

    # Wildcard-Cert deckt beide ab
    ssl_certificate /etc/letsencrypt/live/navoria.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navoria.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/navoria.de/chain.pem;

    # Modernes TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security-Header
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # Body-Limit (für Uploads, z. B. Bulk-Import CSVs)
    client_max_body_size 20M;

    # WebSocket-Upgrade (falls später benötigt)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # Wichtige Header für korrekte URL-Erkennung im Next.js
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeouts (Next.js Long-Requests wie /api/admin/claim-check)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Statische Next.js-Assets — lang cachen
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    # Öffentliche statische Files
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|otf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control 'public, max-age=2592000';
    }

    # Alles andere: an Next.js weiterleiten
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Access-Log
    access_log /var/log/nginx/navoria.access.log;
    error_log /var/log/nginx/navoria.error.log warn;
}
